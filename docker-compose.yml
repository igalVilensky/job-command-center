services:
  postgres:
    image: postgres:16-alpine
    container_name: jobcc-postgres
    environment:
      POSTGRES_USER: jobcc
      POSTGRES_PASSWORD: jobcc
      POSTGRES_DB: jobcc_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobcc -d jobcc_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
